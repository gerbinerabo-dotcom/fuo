          '<label class="form-label" for="edit-profile-description" style="margin-top:12px;">О себе · необязательно</label><textarea id="edit-profile-description" class="input-field" rows="3" maxlength="160" placeholder="Короткая заметка о себе">' + escapeHtml(draft.description) + '</textarea><small id="profile-description-count" style="color:var(--color-text-secondary);">' + draft.description.length + '/160</small>' +
          '<div class="form-group" style="margin-top:14px;"><label class="form-label" for="edit-avatar-base">Аватар</label><select id="edit-avatar-base" class="input-field"><option value="🧑">Исследователь</option><option value="👩">Персонаж</option><option value="👨">Персонаж</option><option value="🧑‍🎓">Ученик</option><option value="🧑‍💻">Специалист</option></select></div>' +
          '<div class="form-group"><span class="form-label">Цвет персонажа</span><div class="avatar-color-options">' + AVATAR_COLORS.map(function(color) { return '<button type="button" class="avatar-color ' + (draft.avatar.color === color ? 'selected' : '') + '" data-avatar-color="' + color + '" style="background:' + color + '" aria-label="Цвет ' + color + '" aria-pressed="' + (draft.avatar.color === color) + '"></button>'; }).join('') + '</div></div>' +
          '<div class="form-group"><label class="form-label" for="edit-avatar-clothes">Одежда · гардероб</label><select id="edit-avatar-clothes" class="input-field">' + renderOwnedItemOptions('clothes', draft.equippedItems.clothes) + '</select></div>' +
          '<div class="form-group"><label class="form-label" for="edit-avatar-accessory">Аксессуар</label><select id="edit-avatar-accessory" class="input-field">' + renderOwnedItemOptions('accessory', draft.equippedItems.accessory) + '</select></div>' +
          '<div class="form-group"><label class="form-label" for="edit-avatar-companion">Компаньон</label><select id="edit-avatar-companion" class="input-field">' + renderOwnedItemOptions('companion', draft.equippedItems.companion) + '</select></div>' +
          '<div class="form-group"><label class="form-label" for="edit-profile-card-style">Оформление карточки профиля</label><select id="edit-profile-card-style" class="input-field"><option value="standard">Стандартное</option><option value="soft">Мягкий акцент</option><option value="outlined">Контур</option></select></div>' +
          '<div class="profile-error" id="profile-editor-error" role="alert"></div><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn" type="submit">Сохранить изменения</button><button class="btn btn-alt" type="button" id="btn-cancel-profile-editor">Отмена</button></div>' +
        '</div><aside class="profile-editor-preview"><b>Предпросмотр</b><div class="profile-photo-preview">\u0424\u043e\u0442\u043e \u043f\u0440\u043e\u0444\u0438\u043b\u044f: ' + renderProfilePhoto('') + '</div><div id="profile-avatar-preview"></div><strong id="profile-name-preview"></strong><small id="profile-description-preview" style="color:var(--color-text-secondary);text-align:center;"></small></aside></div></form></div>';

      var baseSelect = document.getElementById('edit-avatar-base');
      baseSelect.value = draft.avatar.base || '🧑';
      document.getElementById('edit-profile-card-style').value = draft.cardStyle;
      function updatePreview() {
        var preview = document.getElementById('profile-avatar-preview');
        if (!preview) return;
        preview.innerHTML = renderAvatarMarkup(draft.avatar, draft.equippedItems, draft.cardStyle);
        document.getElementById('profile-name-preview').textContent = draft.name.trim() || 'Имя персонажа';
        document.getElementById('profile-description-preview').textContent = draft.description || 'Описание профиля';
      }
      function closeEditor() {
        modal.style.display = 'none';

      document.getElementById('edit-profile-description').oninput = function(event) {

      baseSelect.onchange = function() { draft.avatar.base = baseSelect.value; updatePreview(); };

      document.getElementById('edit-avatar-accessory').onchange = function(event) { draft.equippedItems.accessory = event.target.value; updatePreview(); };

          var idx = +b.getAttribute('data-sim-choice');
          var choice = currentEvent.choices[idx];
          Core.advanceMonthSimulation(sim, choice);
          saveState();
          playSound('success');
          showToast(choice.note);

            openMonthSimModal();
          }
        };
      });
    }

    function detectPhotoType(bytes) {
      if(bytes[0]===255&&bytes[1]===216&&bytes[2]===255)return 'image/jpeg';
      if(bytes[0]===137&&bytes[1]===80&&bytes[2]===78&&bytes[3]===71)return 'image/png';
      if(String.fromCharCode.apply(null,bytes.slice(0,4))==='RIFF'&&String.fromCharCode.apply(null,bytes.slice(8,12))==='WEBP')return 'image/webp';
      return '';
    }

    function renderApp() {
      document.body.setAttribute('data-auth-mode', authMode);
      applyTheme();
      var main = document.getElementById('main-content');
      if (authMode === 'checking') {
        main.innerHTML = '<section class="auth-shell"><div class="auth-panel" role="status">' + iconSvg('LockKeyhole', 24) + ' Проверяем сессию LifeSkill…</div></section>';
        return;
      }
      if (authMode === 'signed-out') {
        main.innerHTML = renderAuthView();
        attachAuthHandlers();
        return;
      }
      updateTopStats();
      var headerPhoto=document.getElementById('header-profile-photo');
      var photoSource = profilePhotoURL || profilePhotoDataURL;
      if (headerPhoto) headerPhoto.innerHTML = escapeHtml(initials()) + (photoSource ? '<img src="' + photoSource + '" alt="" onerror="this.remove()">' : '');

      if (state.page === 'home') main.innerHTML = renderHomeView();
      else if (state.page === 'learn') main.innerHTML = renderLearnView();
      else if (state.page === 'tools') main.innerHTML = renderToolsView();
      else if (state.page === 'character') main.innerHTML = renderCharacterView();
      else if (state.page === 'profile') main.innerHTML = renderProfileView();

      attachEventHandlers();
    }

        btnCalcComp.onclick = function() {
          var wa = +document.getElementById('comp-w-a').value;
          var pa = +document.getElementById('comp-p-a').value;
          var wb = +document.getElementById('comp-w-b').value;
          var pb = +document.getElementById('comp-p-b').value;

          var compRes = Core.compareProductPrices(
            { name: 'Товар А', weight: wa, price: pa },
            { name: 'Товар Б', weight: wb, price: pb }
          );

          var out = document.getElementById('compare-result-box');
          if (compRes.valid) {
            dailyMissionsDone(false);
            out.innerHTML = '' +
              '<div class="example-box">' +
                '<b>Результат:</b> ' + escapeHtml(compRes.insight) + '<br>' +
                'Товар А: <b>' + compRes.pricePerKgA.toLocaleString('ru-RU') + ' ₸/кг</b><br>' +
                'Товар Б: <b>' + compRes.pricePerKgB.toLocaleString('ru-RU') + ' ₸/кг</b>' +
              '</div>';
          } else {
            out.innerHTML = '<div class="badge-pill" style="color:var(--color-danger);">' + escapeHtml(compRes.error) + '</div>';
          }
        };
      }

      // STAR Constructor
      var btnSaveStar = document.getElementById('btn-save-star');
      if (btnSaveStar) {
        btnSaveStar.onclick = function() {
          var s = document.getElementById('star-s').value.trim();
          var t = document.getElementById('star-t').value.trim();
          var a = document.getElementById('star-a').value.trim();
          var r = document.getElementById('star-r').value.trim();

          var formatted = Core.formatStarStory(s, t, a, r);
          if (formatted) {
            state.starNotes = state.starNotes || [];
            state.starNotes.push({ situation: s, task: t, action: a, result: r, combined: formatted, date: new Date().toISOString() });
            dailyMissionsDone(false);
            saveState();
            playSound('success');
            showToast('История по STAR сохранена!');
            renderApp();
          } else {
            alert('Заполни хотя бы одно поле конструктора STAR.');
          }
        };
      }

      document.querySelectorAll('[data-copy-star]').forEach(function(b) {
        b.onclick = function() {
          var idx = +b.getAttribute('data-copy-star');
          var note = state.starNotes[idx];
          if (note && navigator.clipboard) {
            navigator.clipboard.writeText(note.combined || note).then(function() {
              showToast('📋 Текст скопирован в буфер обмена!');
            });
          }
        };
      });

      // Laundry search
      var laundrySearch = document.getElementById('laundry-search-input');
      if (laundrySearch) {
        laundrySearch.oninput = function() {
          var q = laundrySearch.value.toLowerCase().trim();
          var filtered = Data.LAUNDRY_SYMBOLS.filter(function(s) {
            return s.name.toLowerCase().includes(q) || s.meaning.toLowerCase().includes(q);
          });
          var grid = document.getElementById('laundry-grid-container');
          if (grid) {
            grid.innerHTML = filtered.map(function(sym) {
              return '' +
                '<div class="col-4" style="background:var(--color-surface-subtle); border:1px solid var(--color-border); border-radius:var(--radius-button); padding:14px;">' +
                  '<div style="font-size:24px; font-weight:900; margin-bottom:4px;">' + sym.icon + '</div>' +
                  '<b>' + sym.name + '</b>' +
                  '<p style="font-size:12.5px; color:var(--color-text-secondary); margin-top:4px;">' + sym.meaning + '</p>' +
                '</div>';
            }).join('');
          }
        };
      }

      // Wardrobe Shop buy & equip
      document.querySelectorAll('[data-buy-item]').forEach(function(b) {
        b.onclick = function() {
          var iid = b.getAttribute('data-buy-item');
          var item = Data.WARDROBE_ITEMS.find(function(i) { return i.id === iid; });
          var res = Core.purchaseShopItem(state, item);
          if (res.success) {
            playSound('success');
            showToast(res.message);
            saveState();
            renderApp();
          } else {
            playSound('error');
            alert(res.reason);
          }
        };
      });

      document.querySelectorAll('[data-equip-item]').forEach(function(b) {
        b.onclick = function() {
          var iid = b.getAttribute('data-equip-item');
          var type = b.getAttribute('data-item-type');
          state.equippedItems[type] = iid;
          saveState();
          showToast('Предмет экипирован!');
          renderApp();
        };
      });

      var editProfileBtn = document.getElementById('btn-edit-profile');
      if (editProfileBtn) editProfileBtn.onclick = openProfileEditor;
      var themeSettingsBtn = document.getElementById('btn-open-theme-settings');
      if (themeSettingsBtn) themeSettingsBtn.onclick = function() {
        var themeSettings = document.getElementById('theme-settings');
        if (themeSettings) themeSettings.scrollIntoView({ behavior: state.reducedMotion ? 'auto' : 'smooth' });
      };

      document.querySelectorAll('[data-theme-choice]').forEach(function(b) {
        b.onclick = function() {
          setTheme(b.getAttribute('data-theme-choice'));
        };
      });

      var authStartButton = document.getElementById('btn-auth-start');
      if (authStartButton) authStartButton.onclick = function() {
        authPhase = 'email';
        authError = '';
        authMode = 'signed-out';
        renderApp();
      };

      var logoutButton = document.getElementById('btn-auth-logout');
      if (logoutButton) logoutButton.onclick = async function() {
        logoutButton.disabled = true;
        try {
          if (authSaveTimer) {
            clearTimeout(authSaveTimer);
            authSaveTimer = null;
            await authRequest('/api/account/state', 'PUT', { profile: accountProfilePayload(), gameState: accountGamePayload() });
          }
          await authRequest('/api/auth/logout', 'POST', {});
          leaveServerAccount();
        } catch (error) {
          logoutButton.disabled = false;
          showToast(error.message || 'Не удалось завершить сессию.');
        }
      };

      var deleteAccountButton = document.getElementById('btn-auth-delete');
      if (deleteAccountButton) deleteAccountButton.onclick = async function() {
        if (!confirm('Удалить аккаунт LifeSkill, его игровой прогресс, фото и все серверные сессии? Это действие необратимо.')) return;
        deleteAccountButton.disabled = true;
        try {
          await authRequest('/api/account', 'DELETE', { confirm: true });
          leaveServerAccount();
          showToast('Аккаунт и данные на сервере удалены.');
        } catch (error) {
          deleteAccountButton.disabled = false;
          showToast(error.message || 'Не удалось удалить аккаунт.');
        }
      };

      var soundChk = document.getElementById('profile-sound-chk');
      if (soundChk) {
        soundChk.onchange = function() {
          state.soundEnabled = soundChk.checked;
          saveState();
        };
      }

      var motionChk = document.getElementById('profile-motion-chk');
      if (motionChk) {
        motionChk.onchange = function() {
          state.reducedMotion = motionChk.checked;
          saveState();
          applyTheme();
        };
      }

      var pressureChk = document.getElementById('profile-pressure-chk');
      if (pressureChk) {
        pressureChk.onchange = function() {
          state.noPressure = pressureChk.checked;
          saveState();
          showToast(state.noPressure ? 'Режим «Без давления» включён: сердечки больше не теряются' : 'Режим «Без давления» выключен');
        };
      }

      // Export / Import / Reset
      var btnExport = document.getElementById('btn-export-json');
      if (btnExport) {
        btnExport.onclick = function() {
          var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'lifeskill-backup-v3.json';
          a.click();
          URL.revokeObjectURL(url);
          showToast('💾 Резервная копия сохранена в файл!');
        };
      }

      var inputImport = document.getElementById('input-import-json');
      if (inputImport) {
        inputImport.onchange = function(e) {
          var file = e.target.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function() {
            try {
              var parsed = JSON.parse(reader.result);
              if (Core.validateSaveState(parsed)) {
                state = Core.migrateSaveState(parsed);
                saveState();
                playSound('success');
                showToast('Прогресс успешно восстановлен!');
                renderApp();
              } else {
                throw new Error('Invalid structure');
              }
            } catch(err) {
              playSound('error');
              alert('Не удалось прочитать файл резервной копии. Проверьте формат.');
            }
          };
          reader.readAsText(file);
        };
      }

      var btnReset = document.getElementById('btn-reset-all');
      if (btnReset) {
        btnReset.onclick = function() {
          if (confirm('ВНИМАНИЕ! Вы действительно хотите сбросить весь прогресс, достижения и монеты? Это действие необратимо.')) {
            localStorage.removeItem(Core.STORAGE_KEY);
            localStorage.removeItem(Core.BACKUP_KEY);
            state = Core.getInitialState();
            saveState();
            showToast('Прогресс сброшен. Путь начат заново!');
            renderApp();
          }
        };
      }
    }

    // Local files remain available offline; HTTP deployments check the server cookie first.
    initializeAuth();

  })();
  </script>
</body>
</html>
